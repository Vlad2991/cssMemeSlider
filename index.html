<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSSMemeSlider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="radio" id="im1" name="nav__link" checked />
    <input type="radio" id="im2" name="nav__link" />
    <input type="radio" id="im3" name="nav__link" />
    <input type="radio" id="im4" name="nav__link" />
    <div class="wrapper">
      <div class="slider__content">
        <div class="slider im1">
          <div class="container">
            <img
              src="./image/img1.png"
              class="slider__img imge1"
              alt="smex"
            />
          </div>
          <div class="container">
            <img
              src="./image/img2.jpg"
              class="slider__img imge2"
              alt="radocti"
            />
          </div>
          <div class="container">
            <img
              src="./image/img3.jpg"
              class="slider__img imge3"
              alt="veselie"
            />
          </div>
          <div class="container">
            <img
              src="./image/img4.jpg"
              class="slider__img imge4"
              alt="ogorchenie"
            />
          </div>
        </div>
      </div>
      <div class="radio__count">
        <div class="label-cont">
          <label class="label text__1">Циклы почти как женские</label>
          <label class="label text__2">отдых с пивом на выходных</label>
          <label class="label text__3">
           суровая реальность 
          </label>
          <label class="label text__4">жопная жопа,а дальше реакт..</label>
        </div>
        <div class="radio__containe">
          <label for="im1" class="label-button button-1"><span></span></label>
          <label for="im2" class="label-button button-2"><span></span></label>
          <label for="im3" class="label-button button-3"><span></span></label>
          <label for="im4" class="label-button button-4"><span></span></label>
        </div>
      </div>
    </div>
</body>
</html>
